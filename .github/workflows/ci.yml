name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Install HYDROLIB-core integration branch
        run: >-
          uv pip install
          --python "$(uv run python -c 'import sys; print(sys.executable)')"
          "hydrolib-core @
          git+https://github.com/Deltares/HYDROLIB-core.git@69096c172a75ae06d8e6ed14ee4ab395ebd8bfaf"
      - name: Lint
        run: uv run --no-sync ruff check src tests tools
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests tools
      - name: Type-check
        run: uv run --no-sync mypy src/d3dplot
      - name: Test
        run: uv run --no-sync pytest -m "not requireslocaldata"

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev --extra docs
      - name: Build
        run: uv run --no-sync mkdocs build --strict
